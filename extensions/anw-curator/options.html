<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ANW Curator — Options</title>
    <style>
      :root {
        --fg: #1a1a1a;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #1d4ed8;
        --bad: #b91c1c;
        --good: #15803d;
      }
      * { box-sizing: border-box; }
      body {
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: var(--fg);
        max-width: 540px;
        margin: 40px auto;
        padding: 0 20px;
      }
      h1 { font-size: 18px; margin-bottom: 4px; }
      p.sub { color: var(--muted); margin-top: 0; }
      label { display: block; font-weight: 600; margin: 18px 0 6px; }
      input[type="text"], input[type="password"] {
        width: 100%;
        padding: 9px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font: inherit;
      }
      .saved {
        font-size: 13px;
        color: var(--muted);
        margin: 8px 0 0;
      }
      .row { display: flex; gap: 8px; margin-top: 14px; }
      button {
        padding: 9px 14px;
        border: 0;
        border-radius: 6px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary { background: var(--accent); color: #fff; }
      button.ghost { background: #f3f4f6; color: var(--fg); }
      .status { margin-top: 14px; font-size: 13px; min-height: 18px; }
      .status.bad { color: var(--bad); }
      .status.good { color: var(--good); }
    </style>
  </head>
  <body>
    <h1>ANW Curator</h1>
    <p class="sub">Paste your personal API token. It's stored locally in this browser only.</p>

    <label for="token">API token</label>
    <input type="password" id="token" placeholder="anw_…" autocomplete="off" spellcheck="false" />
    <p class="saved" id="saved"></p>

    <div class="row">
      <button class="primary" id="save">Save</button>
      <button class="ghost" id="test">Test token</button>
    </div>

    <div class="status" id="status"></div>

    <script src="options.js"></script>
  </body>
</html>
